services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: local
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nestjs_bootstrap
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      OPENAI_API_KEY: sk-local-placeholder
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_CHAT_MODEL: gpt-5-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      RAG_TOP_K: 5
      RAG_MIN_SCORE: 0.72
      RAG_MAX_CONTEXT_MESSAGES: 8
      CHAT_ANONYMOUS_SESSION_TTL: 30d
    ports:
      - "3000:3000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_bootstrap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_bootstrap"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
